name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check src tests scripts
      - run: pytest -q
      - run: home-credit demo --output artifacts/ci
      - run: docker build -t home-credit-ci .
      - run: docker run --rm home-credit-ci home-credit demo --output /tmp/demo
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-evaluation
          path: |
            artifacts/ci/evaluation.json
            artifacts/ci/bi/*.csv
