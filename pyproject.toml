[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "home-credit-stability"
version = "0.1.0"
description = "Reproducible credit-risk data and model stability platform"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<2", "pandas>=2,<3", "polars>=1,<2", "pyarrow>=15", "duckdb>=1,<2", "scikit-learn==1.7.2", "lightgbm>=4,<5", "joblib>=1.3", "pyyaml>=6", "fastapi>=0.115,<0.120", "uvicorn>=0.29,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.8", "matplotlib>=3.8"]
ops = ["prefect==3.4.25", "mlflow>=2.15,<4"]

[project.scripts]
home-credit = "home_credit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
